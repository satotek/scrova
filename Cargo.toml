[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/satotek/scrova"
rust-version = "1.85"

[workspace.dependencies]
scrova-core = { path = "crates/scrova-core" }
scrova-lastfm = { path = "crates/scrova-lastfm" }
scrova-storage = { path = "crates/scrova-storage" }
thiserror = "2"
uniffi = "0.32"
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = true
codegen-units = 1
